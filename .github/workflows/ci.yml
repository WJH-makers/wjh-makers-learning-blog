name: CI & Release Ref

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test site contracts
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit
        # 当前锁定依赖的 high/critical 审计均为零；把 high 也纳入门禁，
        # 避免新增漏洞只能等到 critical 才阻断发布。
        run: npm audit --audit-level=high

  publish-deploy-ref:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish tested production ref
        run: |
          set -euo pipefail
          git push --force origin "${GITHUB_SHA}:refs/heads/production"
      - name: Verify deployed commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # 权威验证在服务器端:scripts/deploy-from-origin.sh 直接问容器的 /api/version,
          # SHA 不符就拒绝接受这次发布。这里做的是公网边缘的补充探测。
          #
          # Cloudflare 会对 GitHub Actions 的数据中心 IP 发人机挑战(历史 7 次全部如此),
          # 拿回来的是 "Just a moment..." 而不是 JSON —— 那是 runner 出口的网络环境问题,
          # 不代表生产异常,再等 16 分钟也不会变。所以识别到挑战页就明确告警并放行。
          # 但只要真拿到了 JSON 而 commit 对不上,说明生产确实没跟上,照旧失败。
          for attempt in $(seq 1 96); do
            body="$(curl --silent --show-error --max-time 15 https://wwjjhh.online/api/version 2>&1 || true)"
            deployed="$(printf '%s' "$body" | jq -r '.commit // empty' 2>/dev/null || true)"
            if [ -n "$deployed" ]; then
              if [ "$deployed" = "$EXPECTED_SHA" ]; then
                echo "Production is serving ${EXPECTED_SHA:0:12}."
                exit 0
              fi
              echo "Waiting for pull deployment (${attempt}/96): serving ${deployed:0:12}"
            else
              case "$body" in
                *"Just a moment"*|*"challenge-platform"*|*"cf-browser-verification"*)
                  echo "::warning::Cloudflare challenged this runner's IP, so the public-edge check cannot run here. The authoritative check already ran on the server: deploy-from-origin.sh compares the container's /api/version against the target commit and refuses the deploy on mismatch."
                  exit 0
                  ;;
              esac
              echo "Waiting for pull deployment (${attempt}/96): ${body:0:160}"
            fi
            sleep 10
          done
          echo "Production did not reach ${EXPECTED_SHA:0:12} within 16 minutes." >&2
          exit 1

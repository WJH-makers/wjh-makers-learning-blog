services:
  blog:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: https://wwjjhh.online
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
        # Turnstile 的 site key 是 NEXT_PUBLIC_*,由 next build 内联进前端 bundle,
        # 必须在**构建期**给到;env_file 只作用于运行时,配在那里前端拿不到。
        # 值从同目录 .env 读;未配置时为空字符串 —— 前端不渲染 widget、后端跳过校验,
        # 与未启用 Turnstile 时行为一致(两者要么都配,要么都不配)。
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        # R2_PUBLIC_URL 是公开资源域名,构建期注入后静态文章页直接产出边缘资源地址;
        # S3 Access/Secret 只留在运行时 .env,绝不进入 build args。
        R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
        # assetPrefix 由 next build 内联进产物，只能在构建期给。空值 = 静态资源仍走本域，
        # 与改造前完全一致；填成 https://cdn.wwjjhh.online 后 /_next/static/ 才改走 CF 边缘。
        # 回退方式:清空这个变量重新 build。
        NEXT_PUBLIC_ASSET_PREFIX: ${NEXT_PUBLIC_ASSET_PREFIX:-}
    container_name: blog
    # 512m 时实测常驻 394MiB(77%),ISR 重渲染 179 篇正是内存尖峰期 —— 留够头寸,
    # 别让一次重建把容器推到 OOM。宿主 3.7G 尚余 1.5G,加这 256m 无压力。
    mem_limit: 768m
    # 宿主 2 核。1.0 会在渲染尖峰把自己钉死在单核上,而平时负载只有 0.1;
    # cpus 是上限不是预留,给到 1.5 只在需要时多占,空闲时不影响同宿主的其他服务。
    cpus: 1.5
    ports:
      # 必须绑回环:docker 的 publish 会绕过 ufw,一旦写成 0.0.0.0 就只剩云安全组
      # 这一道防线兜底。公网入口只有 Cloudflare Tunnel → nginx,不需要对外监听。
      - "127.0.0.1:3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: 3001
      NETDATA_URL: http://host.docker.internal:19999
      # R2 is used only as a public read origin by the web process. The S3
      # write credentials belong to the host-side sync helper, not this app.
      R2_ACCOUNT_ID: ""
      R2_ENDPOINT: ""
      R2_BUCKET: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      R2_API_TOKEN: ""
    env_file:
      - .env
    volumes:
      - ./content:/app/content:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

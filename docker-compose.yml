services:
  blog:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://wwjjhh.online}
        # Turnstile 的 site key 是 NEXT_PUBLIC_*,由 next build 内联进前端 bundle,
        # 必须在**构建期**给到;env_file 只作用于运行时,配在那里前端拿不到。
        # 值从同目录 .env 读;未配置时为空字符串 —— 前端不渲染 widget、后端跳过校验,
        # 与未启用 Turnstile 时行为一致(两者要么都配,要么都不配)。
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    container_name: blog
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "127.0.0.1:3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: 3001
      NETDATA_URL: http://host.docker.internal:19999
    env_file:
      - .env
    volumes:
      - ./content:/app/content:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

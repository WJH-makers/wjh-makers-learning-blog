services:
  blog:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: https://wwjjhh.online
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
        # Turnstile 的 site key 是 NEXT_PUBLIC_*,由 next build 内联进前端 bundle,
        # 必须在**构建期**给到;env_file 只作用于运行时,配在那里前端拿不到。
        # 值从同目录 .env 读;未配置时为空字符串 —— 前端不渲染 widget、后端跳过校验,
        # 与未启用 Turnstile 时行为一致(两者要么都配,要么都不配)。
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        # R2_PUBLIC_URL 是公开资源域名,构建期注入后静态文章页直接产出边缘资源地址;
        # S3 Access/Secret 只留在运行时 .env,绝不进入 build args。
        R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
        # assetPrefix 由 next build 内联进产物，只能在构建期给。空值 = 静态资源仍走本域，
        # 与改造前完全一致；填成 https://cdn.wwjjhh.online 后 /_next/static/ 才改走 CF 边缘。
        # 回退方式:清空这个变量重新 build。
        NEXT_PUBLIC_ASSET_PREFIX: ${NEXT_PUBLIC_ASSET_PREFIX:-}
    container_name: blog
    # 512m 时实测常驻 394MiB(77%),ISR 重渲染 179 篇正是内存尖峰期 —— 留够头寸,
    # 别让一次重建把容器推到 OOM。宿主 3.7G 尚余 1.5G,加这 256m 无压力。
    mem_limit: 768m
    # 宿主 2 核。1.0 会在渲染尖峰把自己钉死在单核上,而平时负载只有 0.1;
    # cpus 是上限不是预留,给到 1.5 只在需要时多占,空闲时不影响同宿主的其他服务。
    cpus: 1.5
    ports:
      # 必须绑回环:docker 的 publish 会绕过 ufw,一旦写成 0.0.0.0 就只剩云安全组
      # 这一道防线兜底。公网入口只有 Cloudflare Tunnel → nginx,不需要对外监听。
      - "127.0.0.1:3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: 3001
      # 这里曾有 NETDATA_URL。它是死配置:全仓库无任何读者(env.d.ts 也未声明) ——
      # 监控台入口用 lib/site-config.ts 的 https://monitor.${PRIMARY_HOST} 字面派生,
      # server-stats 走 execFile 与 /proc,谁都不看这个变量。留着最坏的形态是:netdata
      # 换端口时有人照着改这里、重启、发现毫无变化,于是把排查方向拐进 extra_hosts 与防火墙。
      # 真要让 server-stats 拉 netdata,连同 env.d.ts 声明与读取代码一起加回来。

      # 仅部署脚本临时注入;它是读取 /api/version 中 commit 的一次性授权,
      # 不写入 .env,也不向公网发送。空值时端点永远只返回 healthy。
      DEPLOY_VERIFICATION_TOKEN: ${DEPLOY_VERIFICATION_TOKEN:-}
      # R2 is used only as a public read origin by the web process. The S3
      # write credentials belong to the host-side sync helper, not this app.
      R2_ACCOUNT_ID: ""
      R2_ENDPOINT: ""
      R2_BUCKET: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      R2_API_TOKEN: ""
    env_file:
      - .env
    # 这里曾挂 ./content:/app/content:ro,把宿主工作树盖在镜像自带的 content 之上
    # (Dockerfile 的 COPY content 被完全遮蔽)。它换不来热更能力,只换来代码/内容错位:
    # 生产下 lib/posts.ts 的 mdPostsCache 一次读取后进程内永不刷新,挂载只在**容器启动那一刻**
    # 生效;而 deploy-from-origin.sh 先 `git reset --hard` 把宿主 ./content 换成新提交,
    # 再 `up -d --build`。构建失败时脚本 exit 1、旧容器仍在跑 —— 此刻旧容器一旦被拉起
    # (OOM-kill、docker 重启、宿主重启),就是用旧代码渲染新内容:新语法退化成裸文本,
    # 改名/删除的文章让索引有链接、点进去 404,而首页 200、healthcheck healthy、CI 绿。
    # 去掉挂载后 content 的唯一事实源是镜像,与 commit 严格同版(CI 的 image job 守住下限)。
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
